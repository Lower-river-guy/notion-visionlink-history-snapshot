# Manual dry-run for notion-visionlink-history-snapshot.
#
# workflow_dispatch only. It does not run on push, pull request, or schedule.
# It executes the deployed job once with an execution override of DRY_RUN=true
# and does not update the job template, image, service account, secret,
# database ids, max retries, or scheduler. The resting job stays DRY_RUN=false.
# Immediately after execute returns, and before waiting for the container,
# the execution spec is checked. If DRY_RUN is not true, the execution is
# cancelled and the workflow fails.

name: diagnostic run

on:
  workflow_dispatch:

concurrency:
  group: visionlink-history-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gcp
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      PROJECT: work-projects-486912
      REGION: us-west1
      JOB: notion-visionlink-history-snapshot
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify job and logging access
        id: precheck
        run: |
          set -euo pipefail
          gcloud run jobs describe "${JOB}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format='value(metadata.name)'
          python3 - << 'PY' > /tmp/dry-run-value.txt
          import json, subprocess, os
          raw = subprocess.check_output([
              "gcloud", "run", "jobs", "describe", os.environ["JOB"],
              "--project", os.environ["PROJECT"],
              "--region", os.environ["REGION"],
              "--format", "json",
          ], text=True)
          job = json.loads(raw)
          found = []
          def walk(node):
              if isinstance(node, dict):
                  env = node.get("env")
                  if isinstance(env, list):
                      for item in env:
                          if isinstance(item, dict) and item.get("name") == "DRY_RUN":
                              found.append(item.get("value"))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(job)
          print(found[-1] if found else "")
          PY
          DRY="$(cat /tmp/dry-run-value.txt)"
          echo "DRY_RUN before execution: ${DRY}"
          if [[ "${DRY}" != "false" ]]; then
            echo "ERROR: live DRY_RUN is '${DRY}', not false. Not executing." >&2
            exit 1
          fi
          if ! gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND resource.labels.location=\"${REGION}\"" \
            --project="${PROJECT}" \
            --limit=1 \
            --freshness=7d \
            --format='value(timestamp)' > /tmp/log-probe.txt 2> /tmp/log-probe.err; then
            echo "ERROR: Cloud Logging read failed. Not executing." >&2
            cat /tmp/log-probe.err >&2
            exit 1
          fi

      - name: Execute once with DRY_RUN override
        id: execute
        run: |
          set -euo pipefail
          echo "Job template is not updated. Execution override is DRY_RUN=true."
          EXECUTION="$(gcloud run jobs execute "${JOB}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --update-env-vars=DRY_RUN=true \
            --format='value(metadata.name)' \
            --quiet)"
          echo "execution=${EXECUTION}" >> "$GITHUB_OUTPUT"
          echo "EXECUTION=${EXECUTION}"
          if [[ -z "${EXECUTION}" ]]; then
            echo "ERROR: execute did not return an execution name. Not executing again." >&2
            exit 1
          fi
          export EXECUTION
          python3 - << 'PY'
          import json, os, subprocess, sys
          execution = os.environ["EXECUTION"]
          raw = subprocess.check_output([
              "gcloud", "run", "jobs", "executions", "describe", execution,
              "--project", os.environ["PROJECT"],
              "--region", os.environ["REGION"],
              "--format", "json",
          ], text=True)
          described = json.loads(raw)
          values = []

          def walk(node):
              if isinstance(node, dict):
                  containers = node.get("containers")
                  if isinstance(containers, list):
                      for container in containers:
                          if not isinstance(container, dict):
                              continue
                          env = container.get("env")
                          if not isinstance(env, list):
                              continue
                          dry = [
                              item.get("value")
                              for item in env
                              if isinstance(item, dict) and item.get("name") == "DRY_RUN"
                          ]
                          if dry:
                              values.append(dry[-1])
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)

          walk(described)
          print(f"execution DRY_RUN values: {values}")
          if not values or any(value != "true" for value in values):
              print("ERROR: execution override is not DRY_RUN=true. Cancelling.", file=sys.stderr)
              subprocess.run([
                  "gcloud", "run", "jobs", "executions", "cancel", execution,
                  "--project", os.environ["PROJECT"],
                  "--region", os.environ["REGION"],
                  "--quiet",
              ], check=False)
              sys.exit(1)
          PY

          COMPLETED=""
          for _ in $(seq 1 160); do
            COMPLETED="$(gcloud run jobs executions describe "${EXECUTION}" \
              --project="${PROJECT}" \
              --region="${REGION}" \
              --format=json | python3 -c 'import json,sys; print((json.load(sys.stdin).get("status") or {}).get("completionTime") or "")')"
            if [[ -n "${COMPLETED}" ]]; then
              break
            fi
            sleep 15
          done
          gcloud run jobs executions describe "${EXECUTION}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format='yaml(metadata.name,status.completionTime,status.succeededCount,status.failedCount,status.conditions)'
          if [[ -z "${COMPLETED}" ]]; then
            echo "ERROR: execution ${EXECUTION} did not finish during the wait. Not executing again." >&2
            exit 1
          fi
          SUCCEEDED="$(gcloud run jobs executions describe "${EXECUTION}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --format='value(status.succeededCount)')"
          if [[ "${SUCCEEDED}" != "1" ]]; then
            echo "execution_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Confirm resting DRY_RUN is still false
        id: restore
        if: always()
        run: |
          set -euo pipefail
          echo "Job template was not updated. Checking resting DRY_RUN."
          python3 - << 'PY' > /tmp/dry-run-restored.txt
          import json, subprocess, os
          raw = subprocess.check_output([
              "gcloud", "run", "jobs", "describe", os.environ["JOB"],
              "--project", os.environ["PROJECT"],
              "--region", os.environ["REGION"],
              "--format", "json",
          ], text=True)
          job = json.loads(raw)
          found = []
          def walk(node):
              if isinstance(node, dict):
                  env = node.get("env")
                  if isinstance(env, list):
                      for item in env:
                          if isinstance(item, dict) and item.get("name") == "DRY_RUN":
                              found.append(item.get("value"))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(job)
          print(found[-1] if found else "")
          PY
          DRY="$(cat /tmp/dry-run-restored.txt)"
          echo "LIVE_DRY_RUN=${DRY}"
          if [[ "${DRY}" != "false" ]]; then
            echo "ERROR: live DRY_RUN is '${DRY}', not false" >&2
            exit 1
          fi

      - name: Read execution logs
        id: logs
        if: always() && steps.execute.outputs.execution != ''
        env:
          EXECUTION: ${{ steps.execute.outputs.execution }}
        run: |
          set -euo pipefail
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND resource.labels.location=\"${REGION}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\"" \
            --project="${PROJECT}" \
            --order=asc \
            --limit=5000 \
            --format=json \
            --freshness=1d > execution-log.json
          python3 - "${EXECUTION}" execution-log.json << 'PY'
          import json, sys
          execution, path = sys.argv[1], sys.argv[2]
          entries = json.load(open(path))
          records = []
          for entry in entries:
              payload = entry.get("jsonPayload") or {}
              text = entry.get("textPayload") or ""
              if not payload and text.startswith("{"):
                  try:
                      payload = json.loads(text)
                  except json.JSONDecodeError:
                      payload = {}
              if payload:
                  records.append(payload)
              elif text:
                  records.append({"message": text})
          blank_ids = [
              "57.22", "11.02", "773.05", "90.35", "990.02", "96.04",
              "773.09", "775.01", "51.24", "10.46", "34.04",
          ]
          normal_ids = ["90.38", "57.78", "PD10.17", "10.22"]
          wanted = blank_ids + normal_ids
          print(f"execution: {execution}")
          print(f"log records: {len(records)}")
          starting = [row for row in records if row.get("message") == "VisionLink History Snapshot starting"]
          finished = [row for row in records if row.get("message") == "snapshot finished"]
          utilization = [row for row in records if row.get("message") == "utilization finished"]
          machine_rows = [row for row in records if row.get("message") == "machine utilization"]
          jumps = [row for row in records if row.get("message") == "impossible hour-meter jump"]
          failures = [row for row in records if str(row.get("message", "")).startswith("machine snapshot failed")]
          update_failures = [row for row in records if row.get("message") == "machine utilization update failed"]
          writes = [row for row in machine_rows if row.get("wouldWrite") is True]
          if starting:
              print(f"start version: {starting[0].get('version')}")
              print(f"start dry run: {starting[0].get('dryRun')}")
          if finished:
              row = finished[-1]
              print(f"status: {row.get('status')}")
              print(f"version: {row.get('version')}")
              print(f"source records: {row.get('sourceRecords')}")
              print(f"history created: {row.get('historyCreated')}")
              print(f"writes performed: {row.get('writesPerformed')}")
              print(f"would create: {row.get('wouldCreate')}")
              print(f"duplicates skipped: {row.get('duplicatesSkipped')}")
              print(f"failed count: {row.get('recordsFailed')}")
              print(f"snapshot run id: {row.get('runId')}")
              print(f"dry run: {row.get('dryRun')}")
          else:
              print("status: snapshot finished record not found")
          if utilization:
              row = utilization[-1]
              print(f"utilization dry run: {row.get('dryRun')}")
              print(f"utilization machines: {row.get('machines')}")
              print(f"utilization updated: {row.get('updated')}")
              print(f"utilization failed: {row.get('failed')}")
          else:
              print("utilization finished record not found")
          print(f"machine utilization rows: {len(machine_rows)}")
          print(f"wouldWrite true: {len(writes)}")
          print(f"impossible jumps logged: {len(jumps)}")
          print(f"utilization update failures: {len(update_failures)}")
          by_machine = {row.get("machineId"): row for row in machine_rows}
          jumps_by_machine = {}
          for row in jumps:
              jumps_by_machine.setdefault(row.get("machineId"), []).append(row)
          for machine_id in wanted:
              row = by_machine.get(machine_id)
              print(f"machine {machine_id}:")
              if row is None:
                  print("  missing machine utilization log")
              else:
                  print(f"  week={row.get('hoursThisWeek')} last={row.get('hoursLastWeek')} month={row.get('hoursThisMonth')} dryRun={row.get('dryRun')} wouldWrite={row.get('wouldWrite')}")
              for jump in jumps_by_machine.get(machine_id, []):
                  print(
                      "  jump "
                      f"baseline={jump.get('baselineHours')} at {jump.get('baselineAt')} "
                      f"ending={jump.get('endingHours')} at {jump.get('endingAt')} "
                      f"delta={jump.get('deltaHours')} elapsed={jump.get('elapsedHours')}"
                  )
          print(f"machine snapshot failures logged: {len(failures)}")
          PY

      - name: Upload execution log
        if: always() && steps.execute.outputs.execution != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-execution-log
          path: execution-log.json
          if-no-files-found: ignore
